[package]
name = "yt-dlptui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for yt-dlp: pick a format, then download"
license = "MIT"
repository = "https://github.com/simoncoulton/yt-dlptui"
keywords = ["yt-dlp", "youtube-dl", "video", "tui", "terminal"]
categories = ["command-line-utilities"]
# let-chains
rust-version = "1.89"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
